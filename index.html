<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>LP-zoeker</title>
<meta name="description" content="Offline zoeken in de LP-bibliotheek">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LP-zoeker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#16130f; --panel:#221e19; --panel2:#2c2721; --line:#3a332b;
  --txt:#f3ece2; --dim:#a89c8c; --acc:#e8a33c;
  --ok:#3fb56b; --okbg:#10321d; --no:#e0564a; --nobg:#3a1714;
  --maybe:#d9b43a; --maybebg:#352c10; --kw:#4c9be8; --kwbg:#12263b;
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(24px + var(--safe-b))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar h1{font-size:17px;margin:0;flex:1;letter-spacing:.2px}
.bar h1 small{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)} .dot.off{background:var(--no)}
.dot.sync{background:var(--acc);animation:pl 1s ease-in-out infinite}@keyframes pl{50%{opacity:.25}}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:19px}
.search{display:flex;gap:8px}
.field{flex:1;position:relative}
.field input{width:100%;height:52px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-size:19px;padding:0 44px 0 16px;outline:none;-webkit-appearance:none}
.field input:focus{border-color:var(--acc)}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.clear{position:absolute;right:6px;top:8px;width:36px;height:36px;border-radius:50%;color:var(--dim);font-size:20px;display:none}
.cam{width:56px;height:52px;border-radius:var(--r);background:var(--acc);color:#1b1307;font-size:24px;display:grid;place-items:center}
.hint{color:var(--dim);font-size:12.5px}
.tools{display:flex;align-items:center;gap:10px;margin-top:9px;min-height:30px}
.kwbtn{flex:none;background:var(--kwbg);color:#cfe5ff;border:1px solid #24496e;border-radius:20px;padding:5px 12px;font-size:14px;font-weight:600}
.kwbtn span{background:var(--kw);color:#fff;border-radius:10px;padding:0 7px;margin-left:4px;font-size:12.5px}
.kwbtn.on{background:var(--kw);color:#fff;border-color:var(--kw)}
.kwbtn b{margin-left:6px;opacity:.85}
.v-kw{background:var(--kwbg);color:#d7e9ff;border:1px solid #24496e}
main{padding:12px 16px}
.verdict{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-weight:600;font-size:18px;display:flex;gap:12px;align-items:center}
.verdict .big{font-size:28px;line-height:1}
.verdict small{display:block;font-weight:400;font-size:13.5px;opacity:.85;margin-top:2px}
.v-ok{background:var(--okbg);color:#c9f2d6;border:1px solid #1f6b3c}
.v-no{background:var(--nobg);color:#ffd6d1;border:1px solid #7a2c25}
.v-maybe{background:var(--maybebg);color:#f6e7b0;border:1px solid #6d5a1c}
.sect{color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;margin:16px 2px 8px}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.card img,.card .ph{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--panel2)}
.card .ph{display:grid;place-items:center;font-size:26px;color:var(--dim)}
.card .body{min-width:0;flex:1}
.card .art{font-weight:700;font-size:16.5px}
.card .alb{font-size:15.5px;margin-top:1px}
.card .meta{color:var(--dim);font-size:13px;margin-top:3px}
.card mark{background:none;color:var(--acc);font-weight:inherit}
.note{font-size:13px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);color:#e8dccb}
.note.kw{background:var(--kwbg);color:#cfe5ff;border:1px solid #24496e}
.pill{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:20px;margin-left:6px;vertical-align:2px;font-weight:600}
.pill.sim{background:var(--maybebg);color:var(--maybe)}
.pill.dup{background:var(--panel2);color:var(--acc)}
.empty{color:var(--dim);text-align:center;padding:40px 20px}
.empty .big{font-size:48px;margin-bottom:8px}
.more{display:block;width:100%;padding:12px;border-radius:var(--r);background:var(--panel);color:var(--dim);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:14px}
.chip.hit{border-color:var(--acc);color:var(--acc)}
/* Sheets / modals */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .pane{background:var(--panel);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(22px + var(--safe-b))}
.pane h2{margin:0 0 12px;font-size:19px}
.pane label{display:block;color:var(--dim);font-size:13px;margin:14px 0 6px}
.pane input[type=url],.pane input[type=text],.pane textarea{width:100%;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--txt);padding:11px 12px;font-size:15px;outline:none}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--acc);color:#1b1307;font-weight:700;margin-top:12px;text-align:center}
.btn.sec{background:var(--panel2);color:var(--txt)}
.btn:disabled{opacity:.5}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--dim);margin-top:8px}
.stat b{color:var(--txt)}
.prog{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* Camera */
.camview{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;overflow:hidden}
.camview.open{display:flex}
.camview video{position:absolute;left:0;right:0;top:calc(52px + var(--safe-t));bottom:calc(178px + var(--safe-b));width:100%;height:calc(100% - 230px - var(--safe-t) - var(--safe-b));object-fit:contain;transform-origin:center;touch-action:none}
.guide{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;
  border:3px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.camtxt{position:absolute;left:0;right:0;top:calc(18px + var(--safe-t));text-align:center;color:#fff;font-size:15px;padding:0 20px;text-shadow:0 1px 3px #000}
.zoombar{position:absolute;left:0;right:0;bottom:calc(122px + var(--safe-b));display:flex;justify-content:center;gap:10px}
.zoombar button{min-width:46px;height:34px;border-radius:17px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:600;padding:0 10px}
.zoombar button.on{background:#fff;color:#000}
.camctl{position:absolute;left:0;right:0;bottom:calc(28px + var(--safe-b));display:flex;justify-content:space-around;align-items:center}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box}
.camctl .icon-btn{background:rgba(255,255,255,.18);color:#fff;width:52px;height:52px;border-radius:50%}
.busy{position:fixed;inset:0;z-index:40;background:rgba(10,8,6,.82);display:none;place-items:center;text-align:center;color:#fff}
.busy.open{display:grid}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--acc);border-radius:50%;animation:s 0.9s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.shot{width:120px;height:120px;border-radius:10px;object-fit:cover;float:right;margin:0 0 8px 12px;border:1px solid var(--line)}
.card img.zoombaar,.shot{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.97);display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.zoom.open{display:flex}
.zoom img{width:min(96vw,96vh);height:min(96vw,96vh);object-fit:contain;border-radius:6px;transform-origin:center;will-change:transform;user-select:none;-webkit-user-select:none}
.zoomTxt{position:absolute;left:16px;right:70px;top:calc(18px + var(--safe-t));color:#fff;font-weight:600;font-size:15px;text-shadow:0 1px 3px #000}
.zoomClose{position:absolute;right:14px;top:calc(10px + var(--safe-t));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + var(--safe-b));z-index:50;background:#000;color:#fff;
  border:1px solid var(--line);padding:12px 14px;border-radius:12px;font-size:14.5px;display:none}
.toast.open{display:block}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1><span class="dot" id="net"></span>LP-zoeker <small id="count"></small></h1>
    <button class="icon-btn" id="btnSettings" aria-label="Instellingen">⚙︎</button>
  </div>
  <div class="search">
    <div class="field">
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="Artiest of album…" enterkeyhint="search">
      <button class="clear" id="clear" aria-label="Wissen">✕</button>
    </div>
    <button class="cam" id="btnCam" aria-label="Foto van hoes">📷</button>
  </div>
  <div class="tools"><button class="kwbtn" id="btnKw" style="display:none"></button><span class="hint" id="hint">📷 = foto van de hoes</span></div>
</header>

<main id="out"></main>

<!-- Instellingen -->
<div class="sheet" id="settings">
  <div class="pane">
    <h2>Bibliotheek</h2>
    <div class="stat" id="syncStat">Nog geen gegevens geladen.</div>
    <div class="prog" id="prog"><i></i></div>
    <button class="btn" id="btnSync">↻ Nu bijwerken (internet nodig)</button>

    <label for="url">Link naar de gegevens (gepubliceerde CSV van de sheet, of Apps Script-export)</label>
    <input id="url" type="url" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?…output=csv" autocomplete="off">
    <button class="btn sec" id="btnSaveUrl">Link bewaren</button>

    <label>Of: bestand importeren (CSV uit Google Sheets of JSON)</label>
    <input type="file" id="fileImp" accept=".csv,.json,text/csv,application/json" style="display:none">
    <button class="btn sec" id="btnFile">📄 Bestand kiezen…</button>

    <label>Foto-herkenning</label>
    <div class="stat" id="ocrStat">Tekstherkenning wordt bij de eerste foto geladen (±7 MB, blijft daarna offline beschikbaar).</div>
    <button class="btn sec" id="btnPreload">Tekstherkenning nu al klaarzetten</button>

    <button class="btn sec" id="btnClose" style="margin-top:22px">Sluiten</button>
  </div>
</div>

<!-- Camera -->
<div class="camview" id="camview">
  <video id="video" playsinline muted autoplay></video>
  <div class="guide"></div>
  <div class="camtxt">Hoes binnen het kader · knijp om te zoomen</div>
  <div class="zoombar" id="zoombar"></div>
  <div class="camctl">
    <button class="icon-btn" id="camClose" aria-label="Sluiten">✕</button>
    <button class="shutter" id="camShoot" aria-label="Foto nemen"></button>
    <button class="icon-btn" id="camLib" aria-label="Uit fotorol">🖼</button>
  </div>
</div>
<input type="file" id="fileCam" accept="image/*" style="display:none">

<div class="busy" id="busy"><div><div class="spin"></div><div id="busyTxt">Bezig…</div></div></div>
<div class="zoom" id="zoom">
  <img id="zoomImg" alt="">
  <div class="zoomTxt" id="zoomTxt"></div>
  <button class="zoomClose" id="zoomClose" aria-label="Sluiten">✕</button>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
